name: CI
on:
  push:
    branches: [ "caddy" ]
  pull_request:
    branches: [ "caddy" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Build
        run: |
          sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install p7zip-full -y
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          cd /home/runner/work/
          git clone --depth=1 --recurse-submodules https://github.com/klzgrad/forwardproxy
          cd forwardproxy
          ~/go/bin/xcaddy build --with github.com/caddyserver/forwardproxy@master=$PWD
      - name: Package Directories
        run: |
          7z a caddy.7z /home/runner/work/forwardproxy/caddy
      - uses: actions/upload-artifact@v7
        with:
          name: CaddyCustomed
          path: caddy.7z
