name: CI
on:
  push:
    branches: [ "win" ]
  pull_request:
    branches: [ "win" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Setup dependencies
        run: |
          cd C:\
          git clone --depth=1 --recurse-submodules https://github.com/frida/frida.git -b 16.1.8
          cd frida ; rm -r -Force ./frida-core
          git clone --depth=1 https://github.com/axojhf/frida-core.git -b patched
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          toolset: 14.3
      - name: Build
        run: |
          cd C:\frida
          ls
          msbuild frida.sln /p:Configuration=Release /p:Platform=x64
          ls
